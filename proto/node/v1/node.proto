syntax = "proto3";

package sbpanel.node.v1;

option go_package = "sbpanel/internal/pb;pb";

// Enrollment: the only RPC callable without a client certificate.
service Enroll {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// NodeHub: every call requires the node's client certificate (mTLS).
// The node always dials the master.
service NodeHub {
  // Long-lived control stream.
  rpc Connect(stream NodeMsg) returns (stream MasterMsg);
  // Durable traffic report; the node deletes it from its spool only after Ack.
  rpc PushTraffic(TrafficReport) returns (Ack);
  // Desired state for this node.
  rpc FetchSpec(FetchSpecRequest) returns (NodeSpec);
  // Certificate renewal before expiry.
  rpc Renew(RenewRequest) returns (EnrollResponse);
  // FetchUpgrade streams the sbnode binary of a release (verified and cached by the master),
  // so nodes never need to reach GitHub themselves.
  rpc FetchUpgrade(FetchUpgradeRequest) returns (stream UpgradeChunk);
}

message EnrollRequest {
  string token = 1;
  bytes csr_der = 2;
  string hostname = 3;
}

message EnrollResponse {
  string node_id = 1;
  bytes cert_der = 2;
  bytes ca_der = 3;
}

message RenewRequest { bytes csr_der = 1; }

message NodeMsg {
  oneof m {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    ApplyResult apply = 3;
    OnlineSnapshot online = 4;
    ConnSnapshot conns = 5;
    CertReport certs = 6;
    UpgradeStatus upgrade = 7;
  }
}

message MasterMsg {
  oneof m {
    SpecAvailable spec = 1;
    Kick kick = 2;
    Ping ping = 3;
    Watch watch = 4;
    CloseConns close_conns = 5;
    KickIPs kick_ips = 6;
    Upgrade upgrade = 7;
  }
}

// Upgrade asks the node to replace its binary (or put the previous one back) and restart.
message Upgrade {
  string version = 1;  // release tag; empty with rollback
  string sha256 = 2;   // of the sbnode binary FetchUpgrade will send
  int64 size = 3;
  bool rollback = 4;   // install <binary>.prev instead
  string health = 5;   // "marker" | "stable" (target predates the health marker)
}

// UpgradeStatus reports progress, and the last result after every (re)connect.
message UpgradeStatus {
  string state = 1;    // downloading | applying | upgraded | rolled_back | failed
  string from = 2;
  string to = 3;
  string error = 4;
  int64 started = 5;
  int64 finished = 6;
  bool can_rollback = 7;
  bool rollback = 8;
}

message FetchUpgradeRequest {
  string version = 1;
  string arch = 2;
}

message UpgradeChunk { bytes data = 1; }

// Watch turns the live connection stream on or off.
message Watch { bool on = 1; }

message CloseConns { repeated uint64 ids = 1; }

// KickIPs drops a user's connections from specific source IPs (device limit).
message KickIPs {
  string user = 1;
  repeated string ips = 2;
}

message ConnInfo {
  uint64 id = 1;
  string user = 2;
  string inbound = 3;
  string outbound = 4;
  string network = 5;
  string host = 6;
  uint32 port = 7;
  string src_ip = 8;
  string rule = 9;
  int64 start = 10;
  int64 up = 11;
  int64 down = 12;
}

message ConnSnapshot {
  repeated ConnInfo conns = 1;
  int64 total = 2;
}

message Hello {
  string version = 1;
  string singbox_version = 2;
  uint64 applied_revision = 3;
  string hostname = 4;
  string os = 5;
  string arch = 6;
  string boot_id = 7;
  repeated string features = 8;  // e.g. "upgrade": the node can be upgraded from the panel
}

message SysInfo {
  double cpu_pct = 1;
  uint64 mem_used = 2;
  uint64 mem_total = 3;
  double load1 = 4;
  uint64 uptime = 5;
  uint64 net_rx = 6;  // bytes, cumulative since boot
  uint64 net_tx = 7;
  uint64 disk_used = 8;
  uint64 disk_total = 9;
  // Uplink interfaces only (those with a default route; no loopback, bridges or tunnels):
  // what the provider bills. Bytes, cumulative since boot; absent from older nodes.
  uint64 wan_rx = 10;
  uint64 wan_tx = 11;
}

message Heartbeat {
  uint64 applied_revision = 1;
  SysInfo sys = 2;
  uint64 spool_backlog = 3;
  int64 active_conns = 4;
  int64 rate_up = 5;    // bytes/s through the core
  int64 rate_down = 6;
  string apply_error = 7;
  ProcInfo proc = 8;     // the sbnode process itself (absent from older nodes)
}

// ProcInfo is one process's own footprint (the node agent with its embedded sing-box,
// or the master).
message ProcInfo {
  double cpu_pct = 1;    // share of the whole machine (all cores = 100)
  uint64 rss = 2;        // resident memory, bytes
  uint64 heap = 3;       // Go heap in use, bytes
  uint32 goroutines = 4;
  uint32 threads = 5;
  int64 started = 6;     // unix seconds
}

message ApplyResult {
  uint64 revision = 1;
  bool ok = 2;
  string error = 3;
}

message OnlineUser {
  string user = 1;
  repeated string ips = 2;
}

message OnlineSnapshot { repeated OnlineUser users = 1; }

message SpecAvailable { uint64 revision = 1; }

message Kick { repeated string users = 1; }

message Ping { int64 ts = 1; }

message FetchSpecRequest { uint64 have_revision = 1; }

// NodeSpec is the complete desired state. sing-box options travel as JSON so the
// master owns the schema and the node stays a thin applier.
message NodeSpec {
  uint64 revision = 1;
  bytes skeleton_json = 2;   // option.Options without inbounds
  string skeleton_hash = 3;
  repeated InboundSpec inbounds = 4;
  repeated UserPolicy policies = 5;
  // Panel-managed certificates (ACME / uploaded) used by this node's inbounds. The node
  // writes them to {dir}/certs/<id>.{crt,key}; a renewal changes only these files (and
  // their hash), never the inbound options, so sing-box hot-reloads without a rebuild.
  repeated CertBundle certs = 6;
  // Node-local certificate files (e.g. certbot) the node reports on (SANs, expiry).
  repeated CertWatch watch_certs = 7;
  NodeRuntime runtime = 8;   // the sbnode process (Go runtime); absent = defaults
}

// NodeRuntime tunes the node agent's Go runtime (it hosts sing-box in-process).
message NodeRuntime {
  int32 gogc = 1;           // GC target percent; 0 = Go default (100)
  int64 memory_limit = 2;   // soft limit in bytes (GOMEMLIMIT); 0 = none
}

message CertBundle {
  string id = 1;
  bytes cert_pem = 2;  // full chain; empty in the stored spec, filled when served
  bytes key_pem = 3;
  string hash = 4;     // of cert+key, part of the spec hash
}

message CertWatch {
  string id = 1;
  string cert_path = 2;
  string key_path = 3;
}

// CertReport is sent on connect, after a spec apply and periodically.
message CertReport {
  repeated CertStatus certs = 1;
  // directory names under /etc/letsencrypt/live (path suggestions in the panel)
  repeated string certbot_names = 2;
}

message CertStatus {
  string id = 1;
  string cert_path = 2;
  int64 not_before = 3;
  int64 not_after = 4;
  repeated string sans = 5;
  string issuer = 6;
  string fingerprint = 7;  // sha256 of the leaf DER, hex
  string error = 8;        // unreadable file, key mismatch, ...
}

// UserPolicy is enforced by the node tracker; changing it never touches inbounds.
message UserPolicy {
  string user = 1;
  int64 speed_up = 2;    // bytes/s, 0 = unlimited
  int64 speed_down = 3;
  int32 device_limit = 4; // distinct source IPs on this node, 0 = unlimited
  // inbound tags this user may not use right now (a traffic limit is used up). The user stays
  // in those inbounds' user lists (subscriptions keep working); the node refuses their new
  // connections there and closes the open ones.
  repeated string blocked_inbounds = 5;
  // At the device limit, a connection from a new IP drops the IP that has been connected
  // the longest instead of being refused. Older nodes ignore it and keep refusing.
  bool kick_oldest = 6;
}

message InboundSpec {
  string tag = 1;
  string type = 2;
  bytes options_json = 3;    // inbound options without "users"
  string options_hash = 4;
  bytes users_json = 5;      // JSON array injected as "users"
  string users_hash = 6;
  repeated string user_names = 7;
  // The node owns the listener and expects a PROXY protocol (v1/v2) header from a
  // local reverse proxy (e.g. nginx stream sharing :443), preserving client IPs.
  bool proxy_protocol = 8;
  // Panel certificate (CertBundle id): the node points tls.certificate_path/key_path
  // at its local copy before starting the inbound.
  string cert_id = 9;
}

message TrafficReport {
  string boot_id = 1;
  uint64 seq = 2;            // persisted, strictly increasing per node
  int64 window_start = 3;    // unix seconds
  int64 window_end = 4;
  repeated UserStat users = 5;
  repeated DimStat dims = 6;
}

message UserStat {
  string user = 1;
  string inbound = 2;
  string outbound = 3;
  int64 up = 4;
  int64 down = 5;
  int64 conns = 6;
}

message DimStat {
  string user = 1;
  string inbound = 2;
  string outbound = 3;
  string host = 4;
  uint32 port = 5;
  string src_ip = 6;
  string network = 7;
  string rule = 8;
  int64 up = 9;
  int64 down = 10;
  int64 conns = 11;
}

message Ack {
  uint64 seq = 1;
  bool duplicate = 2;
}

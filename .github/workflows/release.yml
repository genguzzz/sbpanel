# Tag vX.Y.Z (only maintainers can push v* tags: see the repository's tag ruleset) -> changelog check,
# tests, archives, checksums, build provenance attestations, GitHub release (notes: the tag's
# CHANGELOG.md section, then install instructions). No caches: a release never restores
# state that other workflows (e.g. pull requests) could have written.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      # the release notes list the changes: fail now if CHANGELOG.md has no section for this tag
      - name: changelog
        run: go run ./tools/dist -version "$GITHUB_REF_NAME" -notes-only
      - name: test
        run: |
          cd web && pnpm install --frozen-lockfile && pnpm build && cd ..
          go test -tags with_quic,with_utls,with_acme -count=1 ./...
      - name: build
        run: make dist VERSION="$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*.tar.gz'
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt install.sh \
            --title "sbpanel $GITHUB_REF_NAME" --notes-file dist/NOTES.md

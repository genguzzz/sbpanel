# Tag vX.Y.Z (only maintainers can push v* tags: see the repository's tag ruleset) -> tests, archives,
# checksums, build provenance attestations, GitHub release. No caches: a release never restores
# state that other workflows (e.g. pull requests) could have written.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write      # create the release
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: test
        run: |
          cd web && pnpm install --frozen-lockfile && pnpm build && cd ..
          go test -tags with_quic,with_utls,with_acme -count=1 ./...
      - name: build
        run: make dist VERSION="$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'dist/*.tar.gz'
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt install.sh \
            --title "sbpanel $GITHUB_REF_NAME" --notes-file dist/NOTES.md

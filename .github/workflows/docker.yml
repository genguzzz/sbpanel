# Runtime image ghcr.io/<owner>/sbpanel. It holds no sbpanel binaries (the entrypoint downloads
# the release on start), so it only changes with the Dockerfile / entrypoint or its base image.
name: docker
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [Dockerfile, deploy/docker/**, .github/workflows/docker.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: entrypoint lint
        run: sh -n deploy/docker/entrypoint.sh
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

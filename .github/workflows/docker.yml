# Runtime image ghcr.io/<owner>/sbpanel. It holds no sbpanel binaries (the entrypoint downloads
# the release on start), so it only changes with the Dockerfile / entrypoint or its base image.
# Images carry SLSA provenance and an SBOM, plus a GitHub build provenance attestation
# (gh attestation verify oci://ghcr.io/genguzzz/sbpanel:<tag> --repo genguzzz/sbpanel).
name: docker
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: [Dockerfile, deploy/docker/**, .github/workflows/docker.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: entrypoint lint
        run: sh -n deploy/docker/entrypoint.sh
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # a release tag gets :vX.Y.Z and :X.Y (pinned to that release through SBP_VERSION); :latest
      # (main or a non-pre release) runs the newest release on every start
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'branch' || !contains(github.ref_name, '-') }}
      # the image is a few MB on Alpine: built without a cache, so nothing from other runs is restored
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: SBP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

# Runtime image ghcr.io/<owner>/sbpanel:latest. It holds no sbpanel binaries (the entrypoint
# downloads the newest release on every start; SBP_VERSION pins one), so releases don't rebuild
# it: only a change to the Dockerfile / entrypoint, or a manual run for a new base image.
# Images carry SLSA provenance and an SBOM, plus a GitHub build provenance attestation
# (gh attestation verify oci://ghcr.io/genguzzz/sbpanel:<tag> --repo genguzzz/sbpanel).
name: docker
on:
  push:
    branches: [main]
    paths: [Dockerfile, deploy/docker/**, .github/workflows/docker.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: entrypoint lint
        run: sh -n deploy/docker/entrypoint.sh
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=latest
      # the image is a few MB on Alpine: built without a cache, so nothing from other runs is restored
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

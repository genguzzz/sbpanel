# Code scanning (CodeQL for Go and the web UI), known vulnerabilities in Go dependencies
# (govulncheck) and, on pull requests, newly added vulnerable or disallowed dependencies.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write   # upload code scanning results
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: build
        if: matrix.build-mode == 'manual'
        # web/embed.go embeds web/dist; the analysis doesn't need the real UI build
        run: |
          mkdir -p web/dist && touch web/dist/index.html
          go build -tags with_quic,with_utls,with_acme ./...
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 -tags with_quic,with_utls,with_acme ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: UI preset fixture is current
        run: node --experimental-strip-types web/scripts/preset-fixture.ts --check
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal test tools | tee /dev/stderr)"
      - name: vet
        run: go vet -tags with_quic,with_utls,with_acme ./...
      - name: test
        run: go test -tags with_quic,with_utls,with_acme -count=1 ./...
      - name: shell syntax
        run: sh -n install.sh && sh -n deploy/docker/entrypoint.sh

  # the workflows themselves: syntax and expressions (actionlint), and security (zizmor: script
  # injection, excessive permissions, unpinned actions, persisted credentials, cache poisoning)
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline .github/workflows

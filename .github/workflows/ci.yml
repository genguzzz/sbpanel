name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: web
        run: cd web && pnpm install --frozen-lockfile && pnpm build
      - name: UI preset fixture is current
        run: node --experimental-strip-types web/scripts/preset-fixture.ts --check
      - name: vet
        run: go vet -tags with_quic,with_utls,with_acme ./...
      - name: test
        run: go test -tags with_quic,with_utls,with_acme -count=1 ./...
      - name: shell syntax
        run: sh -n install.sh && sh -n deploy/docker/entrypoint.sh

  # the workflows themselves: syntax and expressions (actionlint), and security (zizmor: script
  # injection, excessive permissions, unpinned actions, persisted credentials, cache poisoning)
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: false
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: zizmor
        run: pipx run zizmor==1.32.0 --offline .github/workflows

# Weekly, grouped: at most one pull request per ecosystem per week. Security updates (Dependabot
# alerts) still arrive as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

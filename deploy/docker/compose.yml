# docker compose -f compose.yml up -d            panel only
# docker compose -f compose.yml --profile node up -d   also a node on this host
# Upgrade: docker compose restart  (fetches the latest release, or SBP_VERSION, on start)
services:
  sbmaster:
    image: ghcr.io/genguzzz/sbpanel:latest
    command: master
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # web UI; put a TLS reverse proxy in front, or use "8080:8080"
      - "9443:9443"             # node gRPC (mTLS)
    environment:
      SBP_VERSION: latest       # or a release such as v0.4.0; SBP_MIRROR: https://<github-proxy>/
      SBM_PUBLIC_GRPC: "panel.example.com:9443"   # what nodes dial; shown in Add node
      SBM_TZ: "Asia/Shanghai"
      # SBM_ADMIN_PASSWORD: "change-me"           # first start only; otherwise printed in the log
    volumes:
      - sbmaster:/var/lib/sbmaster

  sbnode:
    profiles: [node]
    image: ghcr.io/genguzzz/sbpanel:latest
    command: node
    restart: unless-stopped
    network_mode: host          # inbounds listen on whatever ports the panel assigns
    cap_add: [NET_ADMIN]
    ulimits:
      nofile: 1048576
    environment:
      SBP_VERSION: latest
      # copy from the panel's Add node; used only on the first start
      SBN_MASTER: "panel.example.com:9443"
      SBN_TOKEN: ""
      SBN_CA_SHA256: ""
    volumes:
      - sbnode:/var/lib/sbnode

volumes:
  sbmaster:
  sbnode:

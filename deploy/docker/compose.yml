# sbpanel with Docker Compose (see "Docker" in the README).
#   docker compose up -d                   panel only
#   docker compose --profile node up -d    also a node on this host
# Upgrade: docker compose restart (every start fetches the newest release; SBP_VERSION pins one)
#
# Host networking: the panel sees real client addresses (behind nginx / Caddy on this host and for
# nodes connecting to it), and a node can listen on whatever ports the panel assigns.
services:
  sbmaster:
    image: ghcr.io/genguzzz/sbpanel:latest
    command: master
    restart: unless-stopped
    network_mode: host
    environment:
      SBM_WEB: "127.0.0.1:8080"                  # web UI; put an HTTPS reverse proxy in front of it
      SBM_GRPC: ":9443"                          # nodes connect here (mTLS); open it in the firewall
      SBM_PUBLIC_GRPC: "panel.example.com:9443"  # what nodes dial; shown in Add node
      SBM_TZ: "Asia/Shanghai"
      # SBM_ADMIN_PASSWORD: "change-me"          # first start only; otherwise printed in the log
      # SBP_VERSION: "v0.4.5"                   # pin a release instead of the newest
      # SBP_MIRROR: "https://<github-proxy>/"    # if GitHub is slow to reach
    volumes:
      - sbmaster:/var/lib/sbmaster

  sbnode:
    profiles: [node]
    image: ghcr.io/genguzzz/sbpanel:latest
    command: node
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_ADMIN]
    ulimits:
      nofile: 1048576
    environment:
      # copy from the panel's Nodes -> Add node; used only on the first start
      SBN_MASTER: "panel.example.com:9443"
      SBN_TOKEN: ""
      SBN_CA_SHA256: ""
    volumes:
      - sbnode:/var/lib/sbnode

volumes:
  sbmaster:
  sbnode:
